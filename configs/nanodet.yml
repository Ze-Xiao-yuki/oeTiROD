# Architecture inherited from upstream; no automatic weight downloads.
model:
  arch:
    name: NanoDetPlus
    detach_epoch: 10
    backbone:
      name: ShuffleNetV2
      model_size: 1.0x
      out_stages:
      - 2
      - 3
      - 4
      activation: LeakyReLU
      pretrain: false
    fpn:
      name: GhostPAN
      in_channels:
      - 116
      - 232
      - 464
      out_channels: 96
      kernel_size: 5
      num_extra_level: 1
      use_depthwise: true
      activation: LeakyReLU
    head:
      name: NanoDetPlusHead
      num_classes: 13
      input_channel: 96
      feat_channels: 96
      stacked_convs: 2
      kernel_size: 5
      strides:
      - 8
      - 16
      - 32
      - 64
      activation: LeakyReLU
      reg_max: 7
      norm_cfg:
        type: BN
      loss:
        loss_qfl:
          name: QualityFocalLoss
          use_sigmoid: true
          beta: 2.0
          loss_weight: 1.0
        loss_dfl:
          name: DistributionFocalLoss
          loss_weight: 0.25
        loss_bbox:
          name: GIoULoss
          loss_weight: 2.0
data:
  train:
    name: CocoDataset
    input_size:
    - 640
    - 640
    keep_ratio: true
    pipeline:
      perspective: 0.0
      scale:
      - 0.6
      - 1.4
      stretch:
      - - 1
        - 1
      - - 1
        - 1
      rotation: 0
      shear: 0
      translate: 0.2
      flip: 0.5
      brightness: 0.2
      contrast:
      - 0.8
      - 1.2
      saturation:
      - 0.8
      - 1.2
      normalize:
      - - 103.53
        - 116.28
        - 123.675
      - - 57.375
        - 57.12
        - 58.395
  val:
    name: CocoDataset
    input_size:
    - 640
    - 640
    keep_ratio: true
    pipeline:
      normalize:
      - - 103.53
        - 116.28
        - 123.675
      - - 57.375
        - 57.12
        - 58.395
